  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    p {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
    .key-box {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 16px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 16px;
      word-break: break-all;
      user-select: all;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      background: #22c55e;
      color: #052e16;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

    // Đổi tên khóa lưu trữ (ví dụ v2, v3...) nếu sau này bạn muốn reset key mới cho mọi người
    const STORAGE_KEY_NAME = "fixed_random_key_v1";

    function getFixedKey() {
      const saved = localStorage.getItem(STORAGE_KEY_NAME);
      if (saved) {
        return saved;
      }
      if (!KEY_POOL.length) {
        return "HET_KEY";
      }
      const randomIndex = Math.floor(Math.random() * KEY_POOL.length);
      const chosen = KEY_POOL[randomIndex];
      localStorage.setItem(STORAGE_KEY_NAME, chosen);
      return chosen;
    }

    const currentKey = getFixedKey();
    document.getElementById("keyBox").textContent = currentKey;

    function copyKey() {
      if (!currentKey || currentKey === "HET_KEY") return;
      navigator.clipboard.writeText(currentKey).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "✅ Đã sao chép!";
        setTimeout(() => {
          btn.textContent = "📋 Sao chép key";
        }, 1800);
      }).catch(() => {
        alert("Hãy bôi đen và copy thủ công: " + currentKey);
      });
    }
