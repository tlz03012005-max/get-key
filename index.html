<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhận Key - TLZ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .key-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #16a34a; }
    button:disabled {
      background: #475569;
      color: #cbd5e1;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #4ade80;
      min-height: 18px;
    }
    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="stepBadge" class="badge">NHẬN KEY</div>
    <h1>🔑 KEY CỦA BẠN</h1>
    <p>Bấm Copy Key rồi dán ngay vào Bot Telegram để nhận coin.</p>
    <div id="keyBox" class="key-box">Đang tải...</div>
    <button id="copyBtn" onclick="copyAndConsumeKey()">📋 Copy Key</button>
    <div id="statusMsg" class="status"></div>
    <div class="note">Sau khi copy, key sẽ được khóa trên trình duyệt này để tránh dùng lại.</div>
  </div>

  <script>
    // Danh sách key (nạp thật nhiều key khớp với /addkey trên bot)
    const KEY_POOL = [
      "KEY_A1B2C3D4",
      "KEY_E5F6G7H8",
      "KEY_I9J0K1L2",
      "KEY_M3N4O5P6",
      "KEY_Q7R8S9T0",
      "KEY_U1V2W3X4",
      "KEY_Y5Z6A7B8",
      "KEY_C9D0E1F2"
    ];

    const USED_LOCAL_KEY = "tlz_copied_used_keys_v1";

    function getUsedLocal() {
      try {
        return JSON.parse(localStorage.getItem(USED_LOCAL_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function markUsedLocal(key) {
      const used = getUsedLocal();
      if (!used.includes(key)) {
        used.push(key);
        localStorage.setItem(USED_LOCAL_KEY, JSON.stringify(used));
      }
    }

    function pickFreshKey() {
      const used = getUsedLocal();
      const fresh = KEY_POOL.filter(k => !used.includes(k));
      if (fresh.length === 0) return null;
      return fresh[Math.floor(Math.random() * fresh.length)];
    }

    let currentKey = pickFreshKey();
    const keyBox = document.getElementById("keyBox");
    const copyBtn = document.getElementById("copyBtn");
    const statusMsg = document.getElementById("statusMsg");

    if (currentKey) {
      keyBox.textContent = currentKey;
    } else {
      keyBox.textContent = "HẾT KEY MỚI TRÊN TRÌNH DUYỆT NÀY";
      copyBtn.disabled = true;
    }

    function writeClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        try {
          const temp = document.createElement("textarea");
          temp.value = text;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand("copy");
          document.body.removeChild(temp);
          resolve();
        } catch (err) {
          reject(err);
        }
      });
    }

    function copyAndConsumeKey() {
      if (!currentKey) return;
      const copiedKey = currentKey;

      writeClipboard(copiedKey).then(() => {
        markUsedLocal(copiedKey);
        const nextKey = pickFreshKey();

        if (nextKey) {
          currentKey = nextKey;
          keyBox.textContent = currentKey;
          statusMsg.textContent = "✅ Đã copy key & chuyển sang key mới!";
        } else {
          currentKey = null;
          keyBox.textContent = "ĐÃ COPY HẾT KEY MỚI";
          copyBtn.disabled = true;
          statusMsg.textContent = "✅ Đã copy key! Không còn key mới nào chưa dùng trên máy này.";
        }
      }).catch(() => {
        statusMsg.textContent = "⚠️ Không thể copy tự động, hãy thử lại.";
      });
    }
  </script>
</body>
</html>
