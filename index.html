<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhiệm Vụ Lấy Key - TLZ</title>
  <style>
    :root {
      --bg-1: #070b14;
      --bg-2: #0f172a;
      --card: rgba(17, 24, 39, 0.88);
      --item-bg: rgba(15, 23, 42, 0.75);
      --item-done: rgba(20, 83, 45, 0.24);
      --border: rgba(148, 163, 184, 0.16);
      --border-hover: rgba(56, 189, 248, 0.45);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --green-dark: #16a34a;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.14), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(34, 197, 94, 0.12), transparent 42%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .container {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .subtitle strong {
      color: #e2e8f0;
      font-weight: 600;
    }

    .progress-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(51, 65, 85, 0.65);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.3s ease;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--item-bg);
      border: 1px solid var(--border);
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .task-item:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .task-item.is-done {
      background: var(--item-done);
      border-color: rgba(74, 222, 128, 0.3);
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .task-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--muted);
    }

    .tag {
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 10.5px;
    }

    .tag-2k {
      color: #7dd3fc;
      background: rgba(14, 165, 233, 0.16);
    }

    .tag-l4m {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.16);
    }

    .tag-pcs {
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.18);
    }

    .btn-go {
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.28);
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.12s ease;
    }

    .btn-go:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-go:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-go:disabled {
      background: rgba(71, 85, 105, 0.55);
      color: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }

    .footer-bar {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .footer-note {
      font-size: 12px;
      color: var(--muted);
    }

    .btn-reset {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      border-radius: 9px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-reset:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(148, 163, 184, 0.45);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="top-badge">⚡ Nhiệm vụ lấy key</div>
    <h1>🚀 CHỌN LINK VƯỢT LẤY KEY</h1>
    <p class="subtitle">
      Mỗi link chỉ làm được <strong>1 lần</strong>. Chọn 1 link để vượt và nhận Key nhập vào Bot Telegram.
    </p>

    <div class="progress-box">
      <div class="progress-header">
        <span id="progressText">Đã làm: 0/6 link</span>
        <span id="percentText">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div id="taskList" class="task-list"></div>

    <div class="footer-bar">
      <span class="footer-note">Tối đa 6 coin / ngày trên bot</span>
      <button id="resetBtn" class="btn-reset" type="button" onclick="resetTasks()">Reset test</button>
    </div>
  </main>

  <script>
    const TASKS = [
      { id: "task_1", name: "2KTraffic 1", badge: "2KTraffic", tagClass: "tag-2k", url: "https://2ktraffic.com/vuot-link/94gz7wh" },
      { id: "task_2", name: "2KTraffic 2", badge: "2KTraffic", tagClass: "tag-2k", url: "https://2ktraffic.com/vuot-link/nmrcbtn" },
      { id: "task_3", name: "2KTraffic 3", badge: "2KTraffic", tagClass: "tag-2k", url: "https://2ktraffic.com/vuot-link/5e9ipwh" },
      { id: "task_4", name: "Link4M 1", badge: "Link4M", tagClass: "tag-l4m", url: "https://link4m.net/rXfyq6E" },
      { id: "task_5", name: "Link4M 2", badge: "Link4M", tagClass: "tag-l4m", url: "https://link4m.org/rXfyq6E" },
      { id: "task_6", name: "Phienchoso", badge: "Phienchoso", tagClass: "tag-pcs", url: "https://phienchoso.com/6bb534b34a9fa7a9aa8e.rv" }
    ];

    const STORAGE_KEY = "tlz_done_tasks";

    function getDoneTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = JSON.parse(raw || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveDoneTasks(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {}
    }

    function startTask(taskId, url) {
      const doneList = getDoneTasks();
      if (doneList.includes(taskId)) return;

      doneList.push(taskId);
      saveDoneTasks(doneList);
      renderTasks();
      window.location.href = url;
    }

    function resetTasks() {
      saveDoneTasks([]);
      renderTasks();
    }

    function renderTasks() {
      const doneList = getDoneTasks();
      const total = TASKS.length;
      const doneCount = TASKS.filter((t) => doneList.includes(t.id)).length;
      const percent = Math.round((doneCount / total) * 100);

      const progressText = document.getElementById("progressText");
      const percentText = document.getElementById("percentText");
      const progressFill = document.getElementById("progressFill");
      const taskListEl = document.getElementById("taskList");

      if (progressText) progressText.textContent = `Đã làm: ${doneCount}/${total} link`;
      if (percentText) percentText.textContent = `${percent}%`;
      if (progressFill) progressFill.style.width = `${percent}%`;

      if (!taskListEl) return;
      taskListEl.innerHTML = "";

      TASKS.forEach((task) => {
        const isDone = doneList.includes(task.id);

        const row = document.createElement("div");
        row.className = `task-item${isDone ? " is-done" : ""}`;

        const info = document.createElement("div");
        info.className = "task-info";

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.name;

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const tag = document.createElement("span");
        tag.className = `tag ${task.tagClass}`;
        tag.textContent = task.badge;

        const stateLabel = document.createElement("span");
        stateLabel.textContent = isDone ? "Đã sử dụng lượt" : "Khả dụng (1 lần)";

        meta.appendChild(tag);
        meta.appendChild(stateLabel);
        info.appendChild(title);
        info.appendChild(meta);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn-go";
        btn.disabled = isDone;
        btn.textContent = isDone ? "Đã làm" : "Vượt ngay";
        if (!isDone) {
          btn.onclick = () => startTask(task.id, task.url);
        }

        row.appendChild(info);
        row.appendChild(btn);
        taskListEl.appendChild(row);
      });
    }

    document.addEventListener("DOMContentLoaded", renderTasks);
  </script>
</body>
</html>
