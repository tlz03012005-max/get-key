<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhận Key - TLZ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .key-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-copy {
      background: #22c55e;
      color: #052e16;
    }
    .btn-copy:hover { background: #16a34a; }
    .btn-next {
      margin-top: 10px;
      background: #334155;
      color: #f8fafc;
      font-size: 13px;
      padding: 10px 14px;
    }
    .btn-next:hover { background: #475569; }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #4ade80;
      min-height: 18px;
    }
    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="stepBadge" class="badge">NHIỆM VỤ #1</div>
    <h1>🔑 KEY CỦA BẠN</h1>
    <p>Copy key bên dưới rồi quay lại Bot Telegram để nhập nhận coin.</p>
    <div id="keyBox" class="key-box">Đang tải...</div>
    <button class="btn-copy" onclick="copyKey()">📋 Copy Key</button>
    <button class="btn-next" onclick="rollNewKey()">🔄 Cấp key khác cho lượt này</button>
    <div id="statusMsg" class="status"></div>
    <div class="note">F5 sẽ giữ nguyên key hiện tại; qua lượt mới sẽ ra key khác.</div>
  </div>

  <script>
    // Danh sách key (nhớ nạp đồng bộ vào bot bằng /addkey)
    const KEY_POOL = [
      "KEY_A1B2C3D4",
      "KEY_E5F6G7H8",
      "KEY_I9J0K1L2",
      "KEY_M3N4O5P6",
      "KEY_Q7R8S9T0",
      "KEY_U1V2W3X4",
      "KEY_Y5Z6A7B8",
      "KEY_C9D0E1F2"
    ];

    const params = new URLSearchParams(window.location.search);
    const step = params.get("step") || "default";
    const STEP_STORAGE_KEY = "tlz_key_step_" + step;
    const SEEN_STORAGE_KEY = "tlz_seen_keys_v1";

    document.getElementById("stepBadge").textContent =
      step === "default" ? "NHẬN KEY" : "NHIỆM VỤ #" + step;

    function getSeenKeys() {
      try {
        return JSON.parse(localStorage.getItem(SEEN_STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function addSeenKey(key) {
      const seen = getSeenKeys();
      if (!seen.includes(key)) {
        seen.push(key);
        localStorage.setItem(SEEN_STORAGE_KEY, JSON.stringify(seen));
      }
    }

    function pickDifferentKey(excludeKey) {
      const seen = getSeenKeys();
      let candidates = KEY_POOL.filter(k => !seen.includes(k) && k !== excludeKey);
      if (candidates.length === 0) {
        candidates = KEY_POOL.filter(k => k !== excludeKey);
      }
      if (candidates.length === 0) {
        candidates = KEY_POOL;
      }
      const idx = Math.floor(Math.random() * candidates.length);
      return candidates[idx];
    }

    function loadOrCreateKeyForStep() {
      const saved = localStorage.getItem(STEP_STORAGE_KEY);
      if (saved && KEY_POOL.includes(saved)) {
        return saved;
      }
      const picked = pickDifferentKey(null);
      localStorage.setItem(STEP_STORAGE_KEY, picked);
      addSeenKey(picked);
      return picked;
    }

    let currentKey = loadOrCreateKeyForStep();
    document.getElementById("keyBox").textContent = currentKey;

    function rollNewKey() {
      const nextKey = pickDifferentKey(currentKey);
      currentKey = nextKey;
      localStorage.setItem(STEP_STORAGE_KEY, currentKey);
      addSeenKey(currentKey);
      document.getElementById("keyBox").textContent = currentKey;
      document.getElementById("statusMsg").textContent = "🔄 Đã đổi sang key mới!";
    }

    function copyKey() {
      navigator.clipboard.writeText(currentKey).then(() => {
        document.getElementById("statusMsg").textContent = "✅ Đã copy key!";
      }).catch(() => {
        const temp = document.createElement("textarea");
        temp.value = currentKey;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        document.getElementById("statusMsg").textContent = "✅ Đã copy key!";
      });
    }
  </script>
</body>
</html>
