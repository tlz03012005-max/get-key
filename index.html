<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Key - TLZ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 16px;
    }
    .card {
      width: 100%; max-width: 440px; background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 21px; }
    p { margin: 0 0 16px; color: #94a3b8; font-size: 13px; line-height: 1.5; }
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px 14px;
    }
    .task-item.done { opacity: 0.65; border-color: #1e293b; }
    .task-name { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .task-btn {
      padding: 8px 14px; border: none; border-radius: 8px;
      background: #22c55e; color: #052e16; font-weight: 700; font-size: 13px; cursor: pointer;
      white-space: nowrap;
    }
    .task-btn:hover { background: #16a34a; }
    .task-btn:disabled {
      background: #334155; color: #94a3b8; cursor: not-allowed;
    }
    .footer-info {
      margin-top: 14px; font-size: 12px; color: #94a3b8; text-align: center;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .reset-btn {
      background: transparent; border: 1px solid #475569; color: #cbd5e1;
      border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    .reset-btn:hover { border-color: #94a3b8; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">NHIỆM VỤ LẤY KEY</div>
    <h1>🚀 CHỌN LINK VƯỢT LẤY KEY</h1>
    <p>Mỗi link chỉ làm được <b>1 lần</b>. Chọn 1 link để vượt và nhận Key.</p>

    <div id="taskList" class="task-list"></div>

    <div class="footer-info">
      <span id="progressText"></span>
      <button class="reset-btn" onclick="resetTasks()">Reset test</button>
    </div>
  </div>

  <script>
    // Link đích của 6 link rút gọn bên dưới đặt là:
    // https://tlz03012005-max.github.io/get-key/getkey.html?done=1
    const TASKS = [
      { id: 1, name: "2KTraffic 1", url: "https://2ktraffic.com/vuot-link/94gz7wh" },
      { id: 2, name: "2KTraffic 2", url: "https://2ktraffic.com/vuot-link/nmrcbtn" },
      { id: 3, name: "2KTraffic 3", url: "https://2ktraffic.com/vuot-link/5e9ipwh" },
      { id: 4, name: "Link4M 1", url: "https://link4m.net/rXfyq6E" },
      { id: 5, name: "Link4M 2", url: "https://link4m.org/rXfyq6E" },
      { id: 6, name: "Phienchoso", url: "https://phienchoso.com/6bb534b34a9fa7a9aa8e.rv" }
    ];

    const STORAGE_KEY = "tlz_done_tasks";
    const listEl = document.getElementById("taskList");
    const progressEl = document.getElementById("progressText");

    function getDoneIds() {
      try {
        const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(arr) ? arr.map(Number) : [];
      } catch (e) {
        return [];
      }
    }

    function saveDoneIds(ids) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(new Set(ids))));
    }

    function renderTasks() {
      const doneIds = getDoneIds();
      listEl.innerHTML = "";

      TASKS.forEach(task => {
        const isDone = doneIds.includes(task.id);

        const row = document.createElement("div");
        row.className = "task-item" + (isDone ? " done" : "");

        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = task.name;

        const btn = document.createElement("button");
        btn.className = "task-btn";
        btn.disabled = isDone;
        btn.textContent = isDone ? "Đã làm" : "Vượt ngay";

        if (!isDone) {
          btn.onclick = () => {
            const updated = getDoneIds();
            updated.push(task.id);
            saveDoneIds(updated);

            localStorage.removeItem("tlz_key_consumed");
            localStorage.setItem("tlz_current_task", String(task.id));
            window.location.href = task.url;
          };
        }

        row.appendChild(name);
        row.appendChild(btn);
        listEl.appendChild(row);
      });

      progressEl.textContent = `Đã làm: ${doneIds.length}/${TASKS.length} link`;
    }

    function resetTasks() {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("tlz_key_consumed");
      renderTasks();
    }

    renderTasks();
  </script>
</body>
</html>
