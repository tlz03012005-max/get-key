<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Key - TLZ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .btn {
      width: 100%; padding: 13px 16px; border: none; border-radius: 10px;
      background: #22c55e; color: #052e16; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .btn:hover { background: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">BƯỚC 1 / 2</div>
    <h1>🚀 LẤY KEY NHẬN COIN</h1>
    <p>Bấm nút bên dưới để chuyển sang link nhiệm vụ. Hoàn thành xong hệ thống sẽ mở trang nhận Key.</p>
    <button class="btn" onclick="startGetKey()">🔑 Get Key Ngay</button>
  </div>

  <script>
    // Link đích của các link rút gọn bên dưới đặt là:
    // https://tlz03012005-max.github.io/get-key/getkey.html?url=https://tlz03012005-max.github.io/get-key/
    const SHORT_LINKS = [
      "https://2ktraffic.com/vuot-link/5zgqntt",
      "https://sharelinkvn.com/s/kxgbhx8p",
      "https://2ktraffic.com/vuot-link/r5bghim",
      "https://freepasslink.com/s/fgv6anfv",
      "https://2ktraffic.com/vuot-link/ju9e5q7",
      "https://link4m.net/iH2h5oMm"
    ];

    function startGetKey() {
      const idx = Number(localStorage.getItem("tlz_step_idx") || "0") % SHORT_LINKS.length;
      const nextShortLink = SHORT_LINKS[idx];
      localStorage.setItem("tlz_step_idx", String(idx + 1));

      localStorage.setItem("tlz_gate_unlocked", "1");
      window.location.href = nextShortLink;
    }
  </script>
</body>
</html>
