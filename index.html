<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhận Key - TLZ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .key-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #16a34a; }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #4ade80;
      min-height: 18px;
    }
    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="stepBadge" class="badge">NHẬN KEY</div>
    <h1>🔑 KEY CỦA BẠN</h1>
    <p>Copy key bên dưới rồi quay lại Bot Telegram để nhập nhận coin.</p>
    <div id="keyBox" class="key-box">Đang tải...</div>
    <button onclick="copyKey()">📋 Copy Key</button>
    <div id="statusMsg" class="status"></div>
    <div class="note">F5 sẽ giữ nguyên key này; sang lượt khác sẽ cấp key khác.</div>
  </div>

  <script>
    const KEY_POOL = [
      "Key-TLZ-A7K92",
"Key-TLZ-M4X81",
"Key-TLZ-Q9B35",
"Key-TLZ-H2N76",
"Key-TLZ-Z8P41",
"Key-TLZ-C5R93",
"Key-TLZ-W1D68",
"Key-TLZ-L7F24",
"Key-TLZ-B3Y85",
"Key-TLZ-T6J19",
"Key-TLZ-N8A52",
"Key-TLZ-P4V73",
"Key-TLZ-X2C96",
"Key-TLZ-D9M31",
"Key-TLZ-R5H87",
"Key-TLZ-G1W64",
"Key-TLZ-K8Q25",
"Key-TLZ-Y3L90",
"Key-TLZ-F6Z42",
"Key-TLZ-V2B79",
"Key-TLZ-J9P13",
"Key-TLZ-A4N86",
"Key-TLZ-U7C51",
"Key-TLZ-E2X98",
"Key-TLZ-M8R34",
"Key-TLZ-Q5D71",
"Key-TLZ-H9Y26",
"Key-TLZ-Z3K84",
"Key-TLZ-C7V15",
"Key-TLZ-W4F92",
"Key-TLZ-L2J68",
"Key-TLZ-B9A37",
"Key-TLZ-T5N81",
"Key-TLZ-N3P46",
"Key-TLZ-P8X29",
"Key-TLZ-X6M54",
"Key-TLZ-D1Q93",
"Key-TLZ-R7C28",
"Key-TLZ-G4H65",
"Key-TLZ-K2W89",
"Key-TLZ-Y8B13",
"Key-TLZ-F3L76",
"Key-TLZ-V9Z42",
"Key-TLZ-J5D81",
"Key-TLZ-A2R67",
"Key-TLZ-U8Y34",
"Key-TLZ-E6K95",
"Key-TLZ-M1V28",
"Key-TLZ-Q7F63",
"Key-TLZ-H4P19",
"Key-TLZ-Z6N82",
"Key-TLZ-C2X47",
"Key-TLZ-W9M15",
"Key-TLZ-L5Q73",
"Key-TLZ-B1H96",
"Key-TLZ-T8C24",
"Key-TLZ-N6W51",
"Key-TLZ-P3J87",
"Key-TLZ-X9A42",
"Key-TLZ-D4Y68"
    ];

    const params = new URLSearchParams(window.location.search);
    const step = params.get("step") || "default";
    const STEP_KEY = "tlz_locked_key_step_" + step;
    const SEEN_KEY = "tlz_locked_seen_v1";

    document.getElementById("stepBadge").textContent =
      step === "default" ? "NHẬN KEY" : "NHIỆM VỤ #" + step;

    function getSeen() {
      try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"); }
      catch (e) { return []; }
    }

    function markSeen(k) {
      const seen = getSeen();
      if (!seen.includes(k)) {
        seen.push(k);
        localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
      }
    }

    function pickKey() {
      const seen = getSeen();
      let pool = KEY_POOL.filter(k => !seen.includes(k));
      if (!pool.length) pool = KEY_POOL;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    let currentKey = localStorage.getItem(STEP_KEY);
    if (!currentKey || !KEY_POOL.includes(currentKey)) {
      currentKey = pickKey();
      localStorage.setItem(STEP_KEY, currentKey);
      markSeen(currentKey);
    }

    document.getElementById("keyBox").textContent = currentKey;

    function copyKey() {
      navigator.clipboard.writeText(currentKey).then(() => {
        document.getElementById("statusMsg").textContent = "✅ Đã copy key!";
      }).catch(() => {
        const temp = document.createElement("textarea");
        temp.value = currentKey;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        document.getElementById("statusMsg").textContent = "✅ Đã copy key!";
      });
    }
  </script>
</body>
</html>
