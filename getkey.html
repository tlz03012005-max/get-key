<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhận Key - TLZ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .key-box {
      background: #0f172a; border: 1px dashed #38bdf8; border-radius: 12px; padding: 14px;
      font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #38bdf8;
      word-break: break-all; margin-bottom: 14px;
    }
    .key-warn { border-color: #f59e0b; color: #fbbf24; font-size: 15px; }
    .btn {
      width: 100%; padding: 12px 16px; border: none; border-radius: 10px;
      background: #22c55e; color: #052e16; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .btn:disabled { background: #475569; color: #cbd5e1; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 13px; color: #4ade80; min-height: 18px; }
    .back-link { display: inline-block; margin-top: 14px; color: #38bdf8; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HOÀN THÀNH NHIỆM VỤ</div>
    <h1>🔑 KEY CỦA BẠN</h1>
    <p id="descText">Copy key bên dưới rồi quay lại Bot Telegram nhập để nhận coin.</p>
    <div id="keyBox" class="key-box">Đang kiểm tra...</div>
    <button id="copyBtn" class="btn" onclick="copyKey()" disabled>📋 Copy Key</button>
    <div id="statusMsg" class="status"></div>
    <a class="back-link" href="./">← Quay lại trang nhiệm vụ</a>
  </div>

    ];

    const params = new URLSearchParams(window.location.search);
    const isDone = params.get("done") === "1" || Boolean((params.get("url") || "").trim());

    const keyBox = document.getElementById("keyBox");
    const copyBtn = document.getElementById("copyBtn");
    const statusMsg = document.getElementById("statusMsg");

    if (!isDone) {
      keyBox.textContent = "CHƯA HOÀN THÀNH VƯỢT LINK";
      keyBox.classList.add("key-warn");
      document.getElementById("descText").textContent =
        "Vui lòng vượt link xong để mở khóa key (link đích có đuôi ?done=1).";
      copyBtn.disabled = true;
    } else if (localStorage.getItem("tlz_key_consumed") === "1") {
      // Đã xem hoặc tải lại trang ở lượt này -> ẩn key, không sinh key mới
      keyBox.textContent = "KEY ĐÃ ẨN (ĐÃ TẢI LẠI TRANG)";
      keyBox.classList.add("key-warn");
      document.getElementById("descText").textContent =
        "Mỗi lượt vượt chỉ hiển thị key 1 lần. Quay lại làm nhiệm vụ mới để lấy key khác.";
      copyBtn.disabled = true;
    } else {
      localStorage.setItem("tlz_key_consumed", "1");

      const used = JSON.parse(localStorage.getItem("tlz_used_keys") || "[]");
      const fresh = KEY_POOL.filter(k => !used.includes(k));
      const pool = fresh.length > 0 ? fresh : KEY_POOL;
      const chosenKey = pool[Math.floor(Math.random() * pool.length)];

      if (!used.includes(chosenKey)) {
        used.push(chosenKey);
        localStorage.setItem("tlz_used_keys", JSON.stringify(used));
      }

      keyBox.textContent = chosenKey;
      copyBtn.disabled = false;
      copyBtn.dataset.key = chosenKey;
      statusMsg.textContent = "⚠️ Tải lại trang sẽ ẩn key và không sinh key mới.";
    }

    function copyKey() {
      const val = copyBtn.dataset.key;
      if (!val) return;
      const done = () => { statusMsg.textContent = "✅ Đã copy key: " + val; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(done).catch(() => { fallbackCopy(val); done(); });
      } else {
        fallbackCopy(val);
        done();
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
  </script>
