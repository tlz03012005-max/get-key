<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhận Key - TLZ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .key-box {
      background: #0f172a;
      border: 1px dashed #64748b;
      border-radius: 12px;
      padding: 16px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #38bdf8;
      margin-bottom: 16px;
      user-select: all;
      word-break: break-all;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      font-size: 13px;
      line-height: 1.45;
      color: #94a3b8;
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: #38bdf8;
      font-size: 13px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HOÀN THÀNH NHIỆM VỤ</div>
    <h1>🔑 KEY CỦA BẠN</h1>
    <p id="descText">Copy key bên dưới rồi quay lại Bot Telegram nhập để nhận coin.</p>
    <div id="keyBox" class="key-box">Đang kiểm tra...</div>
    <button id="copyBtn" class="btn" type="button" onclick="copyKey()" disabled>📋 Copy Key</button>
    <div id="statusMsg" class="status"></div>
    <a class="back-link" href="./">← Quay lại trang nhiệm vụ</a>
  </div>

  <script>
    // Dán danh sách key lấy từ keys.json (mục "available") vào mảng dưới đây
    const KEY_POOL = [
      // Ví dụ:
      // "TLZ7K2H8",
      // "TLZ3P9C1",
    ];

    const STORAGE_KEY = "tlz_assigned_keys_v1";
    let currentAssignedKey = "";

    function getAssignedKeys() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = JSON.parse(raw || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveAssignedKeys(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {}
    }

    function pickKeyForUser() {
      const cleanPool = KEY_POOL
        .map((k) => String(k || "").trim())
        .filter(Boolean);

      if (cleanPool.length === 0) {
        return { ok: false, message: "Kho key trên trang chưa được cấu hình." };
      }

      const assigned = getAssignedKeys();
      const availableForBrowser = cleanPool.filter((k) => !assigned.includes(k));

      if (availableForBrowser.length === 0) {
        return {
          ok: false,
          message: "Bạn đã nhận hết key khả dụng trên trình duyệt này.",
        };
      }

      const idx = Math.floor(Math.random() * availableForBrowser.length);
      const chosenKey = availableForBrowser[idx];

      assigned.push(chosenKey);
      saveAssignedKeys(assigned);

      return { ok: true, key: chosenKey };
    }

    function copyKey() {
      if (!currentAssignedKey) return;
      const statusBox = document.getElementById("statusMsg");
      const copyBtn = document.getElementById("copyBtn");

      const onDone = () => {
        if (statusBox) {
          statusBox.textContent = `Đã sao chép key: ${currentAssignedKey}`;
        }
        if (copyBtn) {
          const oldText = copyBtn.textContent;
          copyBtn.textContent = "✅ Đã Copy Key";
          setTimeout(() => {
            copyBtn.textContent = oldText;
          }, 1500);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentAssignedKey).then(onDone).catch(() => fallbackCopy(currentAssignedKey, onDone));
      } else {
        fallbackCopy(currentAssignedKey, onDone);
      }
    }

    function fallbackCopy(text, onDone) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        onDone();
      } catch (e) {}
      document.body.removeChild(ta);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const isDone = params.get("done") === "1";

      const keyBox = document.getElementById("keyBox");
      const copyBtn = document.getElementById("copyBtn");
      const statusBox = document.getElementById("statusMsg");
      const descText = document.getElementById("descText");

      if (!isDone) {
        if (keyBox) keyBox.textContent = "CHƯA HOÀN THÀNH";
        if (copyBtn) copyBtn.disabled = true;
        if (descText) descText.textContent = "Bạn chưa hoàn tất bước vượt link.";
        if (statusBox) {
          statusBox.textContent = "Hãy hoàn thành nhiệm vụ vượt link để mở khóa key.";
        }
        return;
      }

      const res = pickKeyForUser();
      if (!res.ok) {
        if (keyBox) keyBox.textContent = "HẾT KEY";
        if (copyBtn) copyBtn.disabled = true;
        if (statusBox) statusBox.textContent = res.message;
        return;
      }

      currentAssignedKey = res.key;
      if (keyBox) keyBox.textContent = res.key;
      if (copyBtn) copyBtn.disabled = false;
      if (statusBox) {
        statusBox.textContent = `Dùng lệnh /nhapkey ${res.key} trong bot Telegram để nhận coin.`;
      }
    });
  </script>
</body>
</html>
